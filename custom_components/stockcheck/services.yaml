set_expiry:
  name: "Set Last Done"
  fields:
    entity_id:
      example: "sensor.take_out_trash"
    value:
      description: "Datetime in ISO format."
      example: "2025-10-07T12:00:00"

set_quantity:
  name: "Set Quantity"
  fields:
    entity_id:
      example: "sensor.take_out_trash"
    value:
      description: "Quantity of stock."
      example: 100

set_unit:
  name: "Set Unit"
  fields:
    entity_id:
      example: "sensor.take_out_trash"
    value:
      description: "Unit type"
      example: "kg"
